name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
      title:
        description: Release title
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-files
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" *.ipk *.sha256 --repo "$GITHUB_REPOSITORY" --target main --title "${{ inputs.title }}" --prerelease --notes-file notes.md
